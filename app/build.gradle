plugins {
    id 'com.android.application'
}

android {
    compileSdk 37
    namespace "io.github.tehcneko.telespeed"

    defaultConfig {
        applicationId "io.github.tehcneko.telespeed.new"
        // libxposed API 102 要求 minSdk >= 26
        minSdkVersion 26
        targetSdkVersion 37
        versionCode 8
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    dependenciesInfo.includeInApk false
}

dependencies {
    // 现代 Xposed API（编译期提供，运行期由框架注入）
    compileOnly 'io.github.libxposed:api:102.0.0'
    // XposedProvider 需要随模块 APK 一起打包，供 RemotePreferences 跨进程读写
    implementation 'io.github.libxposed:service:102.0.0'
}
